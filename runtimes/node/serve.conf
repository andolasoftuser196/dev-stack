# Front layer for the node app process. Identical in shape to every other dx
# runtime's: healthz answered here, everything else proxied.
{
	admin 0.0.0.0:2019
	auto_https off
}

:{$DX_PORT:80} {
	encode zstd gzip

	# Answered by Caddy. Stays 200 while the node process is restarting, which is
	# what stops compose from killing a container you are actively debugging.
	handle {$DX_HEALTHZ:/healthz} {
		respond "ok" 200
	}

	# flush_interval -1 disables response buffering: without it SSE, websocket
	# upgrades and Vite's HMR stream all appear to hang.
	reverse_proxy 127.0.0.1:{$DX_APP_PORT:3000} {
		flush_interval -1
	}

	log {
		output stderr
		format json
		level INFO
	}
}
