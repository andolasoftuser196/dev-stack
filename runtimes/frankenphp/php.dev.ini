; Interactive-development PHP settings. Optimised for "the change I just made is
; live" over throughput.
;
; Every ${...} below is an environment variable that compose fills from the
; config database, so changing a limit is `ssmd config set php.memory_limit 2G`
; followed by `ssmd recreate app` - not an image rebuild.
;
; Every one of these is wrong for production. `ssmd debug prod-parity` swaps in a
; locked-opcache profile when you need to reproduce something that only happens
; with a warm cache.

; Revalidate on every request. Costs a stat() per file; buys you never once
; wondering whether the container is serving stale code.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=${PHP_OPCACHE_MEMORY}
opcache.max_accelerated_files=${PHP_OPCACHE_FILES}

; Render errors into the response. In a container behind a local proxy there is
; no one to leak them to, and a white page with the detail only in a log file is
; the slowest possible debugging loop.
display_errors=On
display_startup_errors=On
error_reporting=E_ALL
log_errors=On
error_log=/dev/stderr

memory_limit=${PHP_MEMORY_LIMIT}
max_execution_time=${PHP_MAX_EXECUTION}
post_max_size=${PHP_POST_MAX}
upload_max_filesize=${PHP_UPLOAD_MAX}
max_input_vars=${PHP_MAX_INPUT_VARS}

date.timezone=${PHP_TIMEZONE}

; Process environment beats anything in the app's own .env file. This is the
; line that makes the compose-injected DB_HOST authoritative - without it an app
; that calls getenv() late reads a stale value from a file and connects to the
; wrong database, which presents as "my migration ran but the table isn't there".
variables_order=EGPCS

; Real exceptions instead of silent nulls, so a bad query fails where it happens.
mysqlnd.collect_statistics=Off
