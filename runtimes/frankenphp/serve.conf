# App-side Caddy config, mounted into the main app, every worktree instance and
# every agent sandbox.
#
# No TLS and no hostname matching: the front proxy terminates HTTPS and
# reverse-proxies here on the internal port with the original Host header intact.
# That is exactly what lets one file serve app.<domain>, <slug>.<domain> and
# <agent>.<domain> without a per-instance config.
{
	admin 0.0.0.0:2019
	frankenphp
	order php_server before file_server

	# TLS terminates at the proxy. Without this Caddy attempts ACME against a
	# domain that does not exist publicly and fails noisily on every boot.
	auto_https off
}

:{$SSMD_PORT:80} {
	root * /app/{$SSMD_DOCROOT:public}
	encode zstd gzip

	request_body {
		max_size {$SSMD_REQUEST_BODY_MAX:64MiB}
	}

	# php_server executes any .php file present on disk. Without this, a file an
	# attacker (or a test fixture) uploaded into the public tree runs as the app.
	# Production web servers usually block this in a config nobody reads; making
	# it explicit here means the dev stack is the stricter of the two.
	@uploads_php path_regexp ^/(uploads|user-uploads|storage)/.+\.php$
	handle @uploads_php {
		respond "Forbidden" 403
	}

	handle /.well-known/* {
		file_server
	}

	# Deny dotfiles, .well-known excepted - the handle above wins because Go's
	# regexp has no negative lookahead to express it in one pattern.
	@hidden path_regexp ^/\.
	handle @hidden {
		respond "Forbidden" 403
	}

	# Answered by Caddy, never by PHP. The compose healthcheck and `ssmd verify`
	# both read this, and both need it to keep answering while the application
	# itself is broken - that is the whole point of the distinction.
	handle {$SSMD_HEALTHZ:/healthz} {
		respond "ok" 200
	}

	# Dev builds emit .map references that are not always written. 204 keeps
	# devtools quiet instead of routing every miss through PHP.
	@sourceMaps path *.map
	handle @sourceMaps {
		respond 204
	}

	handle {
		php_server
	}

	log {
		output stderr
		# JSON, not console. These logs are read far more often by `ssmd logs`
		# filtering and by an agent triaging a failure than by a human watching
		# them stream, and a structured line can be filtered by level and path.
		format json
		level INFO
	}
}
