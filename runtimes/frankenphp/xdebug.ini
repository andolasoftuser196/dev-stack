; Xdebug is loaded but idle unless XDEBUG_MODE says otherwise - `ssmd debug on`
; flips it. Loading the extension with mode=off costs a few percent; installing
; it on demand costs an image rebuild in the middle of a debugging session.
xdebug.mode=${XDEBUG_MODE}
xdebug.start_with_request=yes
xdebug.discover_client_host=false
; The gateway address inside a bridge network. host.docker.internal resolves on
; Docker Desktop but not on Linux, so this is the portable form.
xdebug.client_host=${XDEBUG_CLIENT_HOST}
xdebug.client_port=9003
xdebug.idekey=ssmd
xdebug.log_level=0
xdebug.max_nesting_level=512
