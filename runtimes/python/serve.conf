{
	admin 0.0.0.0:2019
	auto_https off
}

:{$DX_PORT:80} {
	encode zstd gzip

	handle {$DX_HEALTHZ:/healthz} {
		respond "ok" 200
	}

	# Django and friends serve /static and /media themselves in DEBUG, but not
	# with sendfile; letting Caddy do it keeps the dev server free for actual
	# requests and makes a slow page obviously the app's fault.
	handle_path /static/* {
		root * /app/{$DX_STATIC_DIR:static}
		file_server
	}

	reverse_proxy 127.0.0.1:{$DX_APP_PORT:8000} {
		flush_interval -1
	}

	log {
		output stderr
		format json
		level INFO
	}
}
