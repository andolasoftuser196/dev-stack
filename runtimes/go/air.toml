# air config used when the project ships none of its own. Deliberately
# conservative about what triggers a rebuild: watching everything means a
# rebuild every time a log file or a test fixture is written.
root = "/app"
tmp_dir = "/dx/cache/air"

[build]
  cmd = "go build -o /dx/cache/air/main ."
  bin = "/dx/cache/air/main"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "testdata", ".git"]
  exclude_regex = ["_test\\.go$"]
  # Editors write in bursts (save, format-on-save, goimports). Without a delay
  # air starts three builds for one save and the first two are wasted.
  delay = 500
  stop_on_error = false
  send_interrupt = true
  kill_delay = 2000

[log]
  time = true
