{
	admin 0.0.0.0:2019
	auto_https off
}

:{$SSMD_PORT:80} {
	encode zstd gzip

	handle {$SSMD_HEALTHZ:/healthz} {
		respond "ok" 200
	}

	reverse_proxy 127.0.0.1:{$SSMD_APP_PORT:8080} {
		flush_interval -1
		# A rebuild takes the upstream away for a second or two. Without this,
		# every save produces a 502 in the browser and a red line in the log that
		# looks like a crash. With it, the request simply waits for the new binary.
		lb_try_duration 30s
		lb_try_interval 250ms
	}

	log {
		output stderr
		format json
		level INFO
	}
}
