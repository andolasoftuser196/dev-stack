# config/hosts.yml - per-machine overlays, seeded into `host:<name>` scopes.
#
# The highest-priority layer: host:<name> > stack > default. `.env` picks which
# one applies with DX_HOST; everything else about the project stays identical
# across machines, which is the point.
#
# This file is committed. It describes the *kinds* of machine the team uses, not
# any one person's secrets - those are in .env.
#
# Add a machine by adding a key, then set DX_HOST=<key> in .env on it.

# A laptop or workstation. The stack is reachable only from this machine.
local:
  # Loopback-only is the safe default: the app runs with debug on, the database
  # has a trivial password, the DB browser auto-logs-in, and the mail catcher
  # shows every message. None of that matters on loopback and all of it matters
  # on a shared network.
  proxy:
    bind: 127.0.0.1
    http: 80
    https: 443
  bind:
    database: 127.0.0.1
    cache: 127.0.0.1

# A shared development VM reached over the LAN or an SSH tunnel.
vm:
  proxy:
    bind: 0.0.0.0
    http: 80
    https: 443
  bind:
    database: 127.0.0.1
    cache: 127.0.0.1
  # /etc/hosts cannot express a wildcard, so without wildcard DNS each instance
  # needs a line. 1 lets dx write it (needs passwordless sudo); otherwise dx
  # prints the line for you to add.
  manage_etc_hosts: 0

# A machine already running another stack on 80/443. Everything still works;
# the URLs carry a port.
alt-ports:
  proxy:
    bind: 127.0.0.1
    http: 8080
    https: 8443
  bind:
    database: 127.0.0.1
    cache: 127.0.0.1

# CI: no proxy ports published at all, nothing interactive, no browser.
ci:
  proxy:
    bind: 127.0.0.1
    http: 8080
    https: 8443
  bind:
    database: 127.0.0.1
    cache: 127.0.0.1
  tools:
    db_ui: false
    cache_ui: false
    browser: false
    mcp: false
