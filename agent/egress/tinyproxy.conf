# __PLACEHOLDERS__ are substituted by entrypoint.sh from the environment, which
# compose fills from the config database. tinyproxy has no include or variable
# syntax of its own, so templating is the only way to keep these out of the file.

User tinyproxy
Group tinyproxy
Port __EGRESS_PORT__

# Reachable only from the isolated network, which has no route in from anywhere
# else. Binding to all interfaces here is therefore not the exposure it looks
# like - the network is the boundary.
Listen 0.0.0.0
Timeout __EGRESS_TIMEOUT__

# No LogFile: with -d, tinyproxy logs to stdout, which is where container
# logs belong and which avoids it needing write access to a host-owned bind
# mount after it drops privileges.
LogLevel Connect

# StartServers was removed in tinyproxy 1.11; leaving it in produces an
# "obsolete config item" warning on every boot, which trains people to
# ignore the warnings that matter.
MaxClients __EGRESS_MAX_CLIENTS__

# The allowlist. FilterDefaultDeny inverts the usual sense: entries in the file
# are what is ALLOWED, and everything else gets a 403. Getting this backwards
# produces a proxy that blocks a short list and permits the internet, which looks
# identical in every test that only checks the allowed hosts work.
Filter "/etc/egress/filter.re"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive No

# CONNECT is how HTTPS goes through a forward proxy, and it is the only method
# that matters here - everything an agent fetches is TLS. Without these ports
# the allowlist would be perfectly enforced on plain HTTP and irrelevant.
__CONNECT_PORTS__

# Do not advertise what this is to the outside; do not leak the client's address.
DisableViaHeader Yes
Anonymous "Host"
Anonymous "Authorization"
Anonymous "Content-Type"
Anonymous "Content-Length"
Anonymous "User-Agent"
Anonymous "Accept"
Anonymous "Accept-Encoding"
