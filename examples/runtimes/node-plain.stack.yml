# Express (or Fastify, or anything with its own entrypoint).
#
# With framework: none the runtime runs 'npm run dev'. If the script is named
# something else:
#     ssmd config set runtime.start_cmd 'node --watch server.js'
#
# Whatever it runs must listen on $PORT (set to runtime.app_port) and on
# 0.0.0.0. Binding 127.0.0.1 inside a container makes it unreachable from Caddy,
# which presents as a 502 with nothing at all in the application log.
#
# repo.root already points at the matching demo application, so this runs as-is
# from a fresh clone:
#
#     cp examples/runtimes/node-plain.stack.yml config/stack.yml
#     ssmd config import && ssmd up core && ssmd urls
#
# For a real project, change repo.root and repo.git_root to point at it.

name: node-svc
domain: node-svc.test

repo:
  root: demo-apps/express
  git_root: .
  worktree_root: data/worktrees

runtime:
  kind: node
  version: "22"
  framework: none
  docroot: public
  port: 80
  app_port: 3000
  healthz: /healthz
  packages: []

# framework: none derives `npm run dev`. Spelled out because it is the thing
# most likely to differ in a real project.
commands:
  start: "npm run dev"

services:
  database: postgres
  cache: redis
  mail: mailpit
  storage: minio
  search: none
  queue: false
  scheduler: false
  vector: none

database:
  name: node_svc_dev
  user: node_svc
  password: node_svc
  version: "16"

routes:
  app: app
  optional: [mail, db, cache, s3, minio, vnc, mcp]

tools:
  db_ui: true
  cache_ui: true
  browser: true
  mcp: true

hooks:
  # Dependencies are not listed here. `ssmd up` installs them through the runtime
  # module, which knows the right command for the package manager in use and
  # what to do when there is no lockfile yet. Put project-specific one-time
  # setup here instead.
  postCreate: []
  postStart: []
  preDown: []
  postInstance: []

agents:
  max_concurrent: 4
  cpus: "2.0"
  memory: "4g"
  pids_limit: 512
  lease_ttl: "4h"
  egress: allowlist
