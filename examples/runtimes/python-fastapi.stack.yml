# FastAPI with Alembic.
#
# The runtime runs 'uvicorn app.main:app --reload'. Point it elsewhere with:
#     dx config set runtime.asgi_app 'myservice.api:app'
#
# --reload watches the whole tree; on a large repo it can spin a core. The fix
# is uvicorn's --reload-dir, not turning reload off.
#
# repo.root already points at the matching demo application, so this runs as-is
# from a fresh clone:
#
#     cp examples/runtimes/python-fastapi.stack.yml config/stack.yml
#     dx config import && dx up core && dx urls
#
# For a real project, change repo.root and repo.git_root to point at it.

name: fastapi-svc
domain: fastapi-svc.test

repo:
  root: demo-apps/fastapi
  git_root: .
  worktree_root: data/worktrees

runtime:
  kind: python
  version: "3.12"
  framework: fastapi
  docroot: static
  port: 80
  app_port: 8000
  healthz: /healthz
  packages: []

services:
  database: postgres
  cache: redis
  mail: mailpit
  storage: minio
  search: none
  queue: false
  scheduler: false
  vector: none

database:
  name: fastapi_svc_dev
  user: fastapi_svc
  password: fastapi_svc
  version: "16"

routes:
  app: app
  optional: [mail, db, cache, s3, minio, vnc, mcp]

tools:
  db_ui: true
  cache_ui: true
  browser: true
  mcp: true

hooks:
  # Dependencies are not listed here. `dx up` installs them through the runtime
  # module, which knows the right command for the package manager in use and
  # what to do when there is no lockfile yet. Put project-specific one-time
  # setup here instead.
  postCreate: []
  postStart:
    - "alembic upgrade head"
  preDown: []
  postInstance:
    - "alembic upgrade head"

agents:
  max_concurrent: 4
  cpus: "2.0"
  memory: "4g"
  pids_limit: 512
  lease_ttl: "4h"
  egress: allowlist
