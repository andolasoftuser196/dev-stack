# Flask.
#
# The runtime runs 'flask --app app run --debug'. For an app factory elsewhere:
#     ssmd config set runtime.wsgi_app 'myapp:create_app'
#
# No migration hook by default: Flask projects vary too much (Alembic,
# Flask-Migrate, raw SQL) for one to be right more often than it is wrong. Add
# yours to hooks.postStart.
#
# repo.root already points at the matching demo application, so this runs as-is
# from a fresh clone:
#
#     cp examples/runtimes/python-flask.stack.yml config/stack.yml
#     ssmd config import && ssmd up core && ssmd urls
#
# For a real project, change repo.root and repo.git_root to point at it.

name: flask-app
domain: flask-app.test

repo:
  root: demo-apps/flask
  git_root: .
  worktree_root: data/worktrees

runtime:
  kind: python
  version: "3.12"
  framework: flask
  docroot: static
  port: 80
  app_port: 8000
  healthz: /healthz
  packages: []

services:
  database: mysql
  cache: redis
  mail: mailpit
  storage: minio
  search: none
  queue: false
  scheduler: false
  vector: none

database:
  name: flask_app_dev
  user: flask_app
  password: flask_app
  version: "8.0"

routes:
  app: app
  optional: [mail, db, cache, s3, minio, vnc, mcp]

tools:
  db_ui: true
  cache_ui: true
  browser: true
  mcp: true

hooks:
  # Dependencies are not listed here. `ssmd up` installs them through the runtime
  # module, which knows the right command for the package manager in use and
  # what to do when there is no lockfile yet. Put project-specific one-time
  # setup here instead.
  postCreate: []
  postStart: []
  preDown: []
  postInstance: []

agents:
  max_concurrent: 4
  cpus: "2.0"
  memory: "4g"
  pids_limit: 512
  lease_ttl: "4h"
  egress: allowlist
