# Plain PHP - no framework. A legacy application, a single index.php, or a
# framework ssmd does not know about.
#
# framework: none means ssmd offers only the generic verbs (ssmd php, ssmd composer,
# ssmd run) and no queue or scheduler. `ssmd test` still works and still forces a
# disposable database; it just calls vendor/bin/phpunit directly.
#
# Nothing runs at boot: with no framework there is no migration command to guess
# at, and guessing wrong at boot is worse than doing nothing.
#
# repo.root already points at the matching demo application, so this runs as-is
# from a fresh clone:
#
#     cp examples/runtimes/frankenphp-plain.stack.yml config/stack.yml
#     ssmd config import && ssmd up core && ssmd urls
#
# For a real project, change repo.root and repo.git_root to point at it.

name: php-app
domain: php-app.test

repo:
  root: demo-apps/php-plain
  git_root: .
  worktree_root: data/worktrees

runtime:
  kind: frankenphp
  version: "8.3"
  framework: none
  docroot: public
  port: 80
  app_port: 0
  healthz: /healthz
  packages: []

services:
  database: mysql
  cache: redis
  mail: mailpit
  storage: minio
  search: none
  queue: false
  scheduler: false
  vector: none

database:
  name: php_app_dev
  user: php_app
  password: php_app
  version: "8.0"

routes:
  app: app
  optional: [mail, db, cache, s3, minio, vnc, mcp]

tools:
  db_ui: true
  cache_ui: true
  browser: true
  mcp: true

hooks:
  # Dependencies are not listed here. `ssmd up` installs them through the runtime
  # module, which knows the right command for the package manager in use and
  # what to do when there is no lockfile yet. Put project-specific one-time
  # setup here instead.
  postCreate: []
  postStart: []
  preDown: []
  postInstance: []

agents:
  max_concurrent: 4
  cpus: "2.0"
  memory: "4g"
  pids_limit: 512
  lease_ttl: "4h"
  egress: allowlist
