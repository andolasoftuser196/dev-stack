# A Go service. air watches the tree and rebuilds; Caddy holds the request for
# up to 30s while it does, so a save gives a slightly slow response rather than
# a 502 and a red line in the log.
#
# The build cache is on the shared bind mount, so a second instance builds warm.
# A cold `go build` on a large module is memory-hungry - check `ssmd preflight`
# before raising agents.max_concurrent.
#
# Go has no REPL, so `ssmd repl` says so rather than opening something useless.
#
# repo.root already points at the matching demo application, so this runs as-is
# from a fresh clone:
#
#     cp examples/runtimes/go-service.stack.yml config/stack.yml
#     ssmd config import && ssmd up core && ssmd urls
#
# For a real project, change repo.root and repo.git_root to point at it.

name: go-api
domain: go-api.test

repo:
  root: demo-apps/go
  git_root: .
  worktree_root: data/worktrees

runtime:
  kind: go
  version: "1.23"
  framework: none
  docroot: static
  port: 80
  app_port: 8080
  healthz: /healthz
  packages: []

services:
  database: postgres
  cache: redis
  mail: mailpit
  storage: minio
  search: none
  queue: false
  scheduler: false
  vector: none

database:
  name: go_api_dev
  user: go_api
  password: go_api
  version: "16"

routes:
  app: app
  optional: [mail, db, cache, s3, minio, vnc, mcp]

tools:
  db_ui: true
  cache_ui: true
  browser: true
  mcp: true

hooks:
  # Dependencies are not listed here. `ssmd up` installs them through the runtime
  # module, which knows the right command for the package manager in use and
  # what to do when there is no lockfile yet. Put project-specific one-time
  # setup here instead.
  postCreate: []
  postStart: []
  preDown: []
  postInstance: []

agents:
  max_concurrent: 4
  cpus: "2.0"
  memory: "4g"
  pids_limit: 512
  lease_ttl: "4h"
  egress: allowlist
